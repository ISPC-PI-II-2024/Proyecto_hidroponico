; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform    = espressif32
board       = esp32dev
framework   = arduino

; -----------------------------------------
; Dónde buscar librerías locales (tu carpeta lib/)
; -----------------------------------------
lib_extra_dirs = lib

; -----------------------------------------
; Dependencias externas necesarias
; -----------------------------------------
lib_deps = 
    tzapu/WiFiManager @ ^2.0.3 ; Para el portal cautivo y parámetros vía web
    vshymanskyy/TinyGSM @ ^0.12.0 ; Cliente GSM para ESP32
    knolleary/PubSubClient @ ^2.8 ; Cliente MQTT compatible con Wi-FiClient o TinyGsmClient
    bblanchon/ArduinoJson @ ~7.4.1 ; Para manejar JSON en mensajes MQTT

; -----------------------------------------
; Velocidad del monitor serie
; -----------------------------------------
monitor_speed = 115200

; -----------------------------------------
; Flags de compilación
; ----------------------------------------
build_flags =
  -DTINY_GSM_MODEM_SIM800

; -----------------------------------------
; Carpeta de salida de compilación (no tocar)
; -----------------------------------------
build_dir = .pio

