; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform    = espressif32
board       = esp32dev
framework   = arduino

; -----------------------------------------
; Dónde buscar librerías locales (tu carpeta lib/)
; -----------------------------------------
lib_extra_dirs = lib

; -----------------------------------------
; Dependencias externas necesarias
; -----------------------------------------
lib_deps = 
    tzapu/WiFiManager @ ^2.0.3                  
    vshymanskyy/TinyGSM @ ^0.12.0               
    knolleary/PubSubClient @ ^2.8               
    bblanchon/ArduinoJson @ ~7.4.1              
    adafruit/Adafruit BMP280 Library @ ~2.6.8   
    adafruit/DHT sensor library                 
    adafruit/BH1750@^1.0.1                      
    rlogiacco/MQUnifiedsensor@^1.4.3            
    adafruit/RTClib@^1.14.1                     

; -----------------------------------------
; Velocidad del monitor serie
; -----------------------------------------
monitor_speed = 115200

; -----------------------------------------
; Flags de compilación
; ----------------------------------------
build_flags =
  -DTINY_GSM_MODEM_SIM800
  -DMQTT_MAX_PACKET_SIZE=1536